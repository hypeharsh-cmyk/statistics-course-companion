<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics — Mock Tests</title>
<meta name="description" content="Four full-length mock papers for Introductory Statistics (MST 02), 50 marks each, with complete worked solutions, a countdown timer and per-candidate self-scoring.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Statistics — Mock Tests">
<meta property="og:description" content="Four full-length mock papers with complete solutions, timer and self-scoring.">
<meta name="twitter:card" content="summary">
<script>
  window.MathJax = {
    tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] },
    startup: { pageReady: () => MathJax.startup.defaultPageReady().then(() => document.body.classList.add('math-ready')) }
  };
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
<script>
  try{ var t=localStorage.getItem('stats-theme'); if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);} }catch(e){}
</script>
@@BOOK_STYLE@@
<style>
body{font-size:17px}
[hidden]{display:none!important}
#gate{
  position:fixed;inset:0;z-index:400;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
}
#gate .card{width:100%;max-width:27rem}
#gate h1{font-size:1.65rem;line-height:1.2;letter-spacing:-.015em;margin:0 0 .4rem}
#gate .sub{color:var(--ink-3);font-family:var(--sans);font-size:.85rem;margin:0 0 1.6rem}
#gate label{display:block;font-family:var(--sans);font-size:.72rem;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-3);margin:0 0 .5rem}
.who{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.1rem}
.who button{
  font-family:var(--sans);font-size:.85rem;padding:.5rem .9rem;border-radius:.4rem;
  border:1px solid var(--rule-2);background:var(--paper-2);color:var(--ink);cursor:pointer;
}
.who button:hover{border-color:var(--accent);color:var(--accent)}
.who button .x{color:var(--ink-3);margin-left:.45rem;font-size:.9em}
.row{display:flex;gap:.5rem}
input[type=text],textarea,input[type=number]{
  font-family:var(--sans);font-size:.9rem;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule-2);border-radius:.4rem;padding:.55rem .7rem;width:100%;
}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.btn{
  font-family:var(--sans);font-size:.85rem;font-weight:500;cursor:pointer;
  border:1px solid var(--rule-2);background:var(--paper-2);color:var(--ink);
  border-radius:.4rem;padding:.55rem 1rem;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{border-color:var(--rule-2);color:var(--ink)}
#topbar{
  position:sticky;top:0;z-index:120;background:var(--paper-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:1rem;padding:.6rem 1.2rem;flex-wrap:wrap;
}
#topbar .brand{font-family:var(--serif);font-size:1.05rem;letter-spacing:-.01em;margin-right:auto}
#topbar .brand span{display:block;font-family:var(--sans);font-size:.62rem;
  text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3)}
.userchip{
  font-family:var(--sans);font-size:.8rem;display:inline-flex;align-items:center;gap:.5rem;
  background:var(--accent-soft);color:var(--accent);border-radius:2rem;padding:.3rem .8rem;
}
.tabs{display:flex;gap:.3rem;padding:.7rem 1.2rem 0;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);background:var(--paper-2)}
.tab{
  font-family:var(--sans);font-size:.83rem;cursor:pointer;background:none;border:none;
  color:var(--ink-2);padding:.55rem .85rem;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--accent)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;
  background:var(--green);margin-left:.4rem;vertical-align:middle}
.pane{display:none}
.pane.on{display:block}
.sheet{max-width:var(--maxw);margin:0 auto;padding:2rem 1.2rem 5rem}
.examhead{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:1.1rem;margin-bottom:1.3rem}
.examhead .inst{font-family:var(--sans);font-size:.7rem;text-transform:uppercase;
  letter-spacing:.14em;color:var(--ink-3)}
.examhead h1{font-size:1.5rem;margin:.5rem 0 .3rem;letter-spacing:-.01em}
.examhead .meta{font-family:var(--sans);font-size:.82rem;color:var(--ink-2)}
.timerbar{
  position:sticky;top:3.2rem;z-index:110;display:flex;align-items:center;gap:.7rem;
  background:var(--paper-2);border:1px solid var(--rule);border-radius:.5rem;
  padding:.6rem .8rem;margin-bottom:1.6rem;flex-wrap:wrap;
}
.clock{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums;
  letter-spacing:.02em;margin-right:auto}
.clock.warn{color:var(--red)}
.clock.done{color:var(--ink-3)}
.qmeta{font-family:var(--sans);font-size:.78rem;color:var(--ink-3);
  font-style:italic;letter-spacing:.01em;margin-bottom:.7rem}
.exercise .hd .mk{float:right;font-weight:400;opacity:.7;letter-spacing:.06em}
.exercise .hd{overflow:hidden}
.ansblock{margin:.9rem 0 .2rem}
.ansblock label{display:block;font-family:var(--sans);font-size:.72rem;
  text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:.4rem}
textarea.ans{min-height:4.5rem;resize:vertical;line-height:1.55}
.lockmsg{font-family:var(--sans);font-size:.8rem;color:var(--ink-3);font-style:italic;margin:.7rem 0 0}
.markrow{
  display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:1rem;
  padding-top:.9rem;border-top:1px dashed var(--rule-2);
}
.markrow label{font-family:var(--sans);font-size:.8rem;color:var(--ink-2)}
.markrow input{width:5rem}
.markrow .of{font-family:var(--sans);font-size:.8rem;color:var(--ink-3)}
.scorecard{
  background:var(--paper-2);border:1px solid var(--rule);border-radius:.5rem;
  padding:1.2rem 1.3rem;margin:2rem 0 1rem;
}
.scorecard h3{margin:0 0 .3rem;font-size:1.1rem}
.bigscore{font-family:var(--mono);font-size:2.2rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.bigscore small{font-size:.95rem;color:var(--ink-3);font-family:var(--sans)}
.legend{font-family:var(--sans);font-size:.78rem;color:var(--ink-3);margin-top:.5rem;line-height:1.6}
.pill{display:inline-block;font-family:var(--sans);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.1em;padding:.16rem .5rem;border-radius:2rem;vertical-align:middle;margin-left:.5rem}
.pill.hard{background:var(--red-soft);color:var(--red)}
.pill.std{background:var(--blue-soft);color:var(--blue)}
.pill.peek{background:var(--gold-soft);color:var(--gold)}
.tblnote{font-family:var(--sans);font-size:.8rem;color:var(--ink-3);margin:.3rem 0 1.4rem}
#tables table{font-family:var(--mono);font-size:.74rem}
#tables .tw{margin-bottom:2.2rem}
@media print{
  #topbar,.tabs,.timerbar,.reveal-btn,.revealall,.markrow,.ansblock,#gate,.noprint{display:none!important}
  .pane{display:block!important}
  .solution{display:block!important;max-height:none!important;opacity:1!important}
  .sheet{max-width:none;padding:0}
}
@media (max-width:640px){
  .sheet{padding:1.4rem .9rem 4rem}
  .clock{font-size:1.15rem}
  #topbar{padding:.55rem .9rem}
  .tabs{padding:.6rem .9rem 0}
}
</style>
</head>
<body>

<div id="gate" hidden>
  <div class="card">
    <h1>Who is sitting this paper?</h1>
    <p class="sub">Your answers, timer and marks are saved separately for each name on this device.</p>
    <label>Saved candidates</label>
    <div class="who" id="whoList"></div>
    <label for="newName">Add a candidate</label>
    <div class="row">
      <input type="text" id="newName" maxlength="24" placeholder="First name" autocomplete="off">
      <button class="btn primary" id="addWho">Start</button>
    </div>
    <p class="legend" id="gateNote"></p>
  </div>
</div>

<div id="app" hidden>
<div id="topbar">
  <div class="brand">Mock Tests<span>Introductory Statistics · MST 02</span></div>
  <span class="userchip" id="chip"></span>
  <button class="btn" id="switchUser">Switch</button>
  <a class="btn" href="index.html">Textbook</a>
  <a class="btn" href="workshop.html">Workshop</a>
  <button class="btn" id="themeBtn">Dark</button>
  <button class="btn" id="printBtn">Print</button>
</div>
<div class="tabs" id="tabs">
</div>
