<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Statistics</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#fbf9f5; --ink:#1e1c19; --ink-3:#7b756a; --accent:#8a4b2a; --rule:#e0d9cc;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#16151a; --ink:#e9e5dd; --ink-3:#8d8578; --accent:#d99b6c; --rule:#2e2c35; }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
  background:var(--paper); color:var(--ink); font-family:var(--serif); line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
main{max-width:32rem; text-align:center}
.code{
  font-family:var(--sans); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:1.25rem;
}
h1{font-size:1.9rem; line-height:1.25; letter-spacing:-.015em; margin:0 0 .85rem}
p{color:var(--ink-3); margin:0 0 2rem}
a.home{
  display:inline-block; font-family:var(--sans); font-size:.85rem; text-decoration:none;
  color:var(--accent); border:1px solid var(--rule); border-radius:.4rem;
  padding:.6rem 1.15rem; transition:border-color .15s ease;
}
a.home:hover{border-color:var(--accent)}
svg{display:block; margin:0 auto 1.75rem; width:112px; height:auto}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 64" aria-hidden="true">
    <path d="M6 52 C26 52 28 12 60 12 C92 12 94 52 114 52" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <line x1="6" y1="52" x2="114" y2="52" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round"/>
    <line x1="102" y1="20" x2="102" y2="52" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="3 3"/>
  </svg>
  <div class="code">Error 404</div>
  <h1>This page is out in the tail</h1>
  <p>There is nothing at this address. The book lives at the root.</p>
  <a class="home" href="/">Back to the textbook</a>
</main>
</body>
</html>
